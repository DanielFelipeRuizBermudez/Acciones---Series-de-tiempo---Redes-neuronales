name: Reentrenar modelos

on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reentrenar
  cancel-in-progress: false

jobs:
  reentrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar datos y entrenar
        run: python entrenar.py --ticker AAPL

      - name: Guardar datos y modelos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos modelos_entrenados
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar"
            exit 0
          fi
          git commit -m "Reentrenamiento diario $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
